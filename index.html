

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDK Wettkampf-Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #00ff66;
      font-family: "Consolas", "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      cursor: pointer;
      /* Kein Doppeltipp-Zoom auf Tablets */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #timer {
      font-size: 34vw;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      text-shadow: 0 0 35px rgba(0, 255, 102, 0.25);
      transition: color 0.15s, text-shadow 0.15s;
    }
    /* Bereit (nicht gestartet): gedimmt, damit "läuft" auf einen Blick erkennbar ist */
    #timer.idle { color: #1d6b3f; text-shadow: none; }
    #fullscreen {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: 1px solid #262626;
      border-radius: 6px;
      color: #4a4a4a;
      font-size: 1.4rem;
      line-height: 1;
      width: 44px;
      height: 44px;
      cursor: pointer;
    }
    #fullscreen:hover { color: #888; border-color: #444; }
    :fullscreen #fullscreen { display: none; }
    #status {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: #383838;
      font-family: system-ui, -apple-system, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .warning { color: #ffbb00 !important; text-shadow: 0 0 35px rgba(255, 187, 0, 0.3) !important; }
    .danger { color: #ff3333 !important; text-shadow: 0 0 35px rgba(255, 51, 51, 0.4) !important; }
    .blink { animation: flash 0.4s infinite alternate; }
    @keyframes flash { from { opacity: 1; } to { opacity: 0.2; } }
  </style>
</head>
<body>
  <div id="timer">01:00</div>
  <button id="fullscreen" title="Vollbild (F)" aria-label="Vollbild">⛶</button>
  <div id="status">[ Enter / Leertaste / Tippen ] Start / Reset &nbsp;·&nbsp; [ F ] Vollbild</div>

  <script>
    const DURATION = 60;
    let timeLeft = DURATION;
    let timerId = null;
    let autoResetTimeout = null;

    const timerEl = document.getElementById('timer');

    function renderDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
      timerEl.className = '';

      if (timerId === null && timeLeft === DURATION) {
        timerEl.classList.add('idle');
      } else if (timeLeft === 0) {
        timerEl.classList.add('danger', 'blink');
      } else if (timeLeft <= 10) {
        timerEl.classList.add('warning');
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      clearTimeout(autoResetTimeout);
      timerId = null;
      autoResetTimeout = null;
      timeLeft = DURATION;
      renderDisplay();
    }

    function startTimer() {
      clearTimeout(autoResetTimeout);
      const targetTime = Date.now() + DURATION * 1000;

      timerId = setInterval(() => {
        // ceil: 00:00 erst nach vollen 60 s, nicht 0,5 s zu früh
        const remaining = Math.ceil((targetTime - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerId);
          timerId = null;
          timeLeft = 0;
          renderDisplay();
          // Springt nach Ablauf nach 3 Sekunden automatisch auf 01:00 zurück
          autoResetTimeout = setTimeout(resetTimer, 3000);
        } else {
          timeLeft = remaining;
          renderDisplay();
        }
      }, 100);
      // Sofort hell anzeigen, damit der Start sichtbar quittiert wird
      renderDisplay();
    }

    function toggleTimer() {
      if (timerId === null) {
        // Falls noch bei 00:00 (vor dem automatischen Reset), erst zurücksetzen
        if (timeLeft === 0) resetTimer();
        startTimer();
      } else {
        // Vorzeitiger Abbruch (z. B. Hantel herausgehoben) -> sofort 01:00
        resetTimer();
      }
    }

    // Vollbild (inkl. webkit-Präfix für ältere Safari/iPad)
    const fsButton = document.getElementById('fullscreen');
    const root = document.documentElement;
    const canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);
    if (!canFullscreen) fsButton.style.display = 'none';

    function toggleFullscreen() {
      if (!canFullscreen) return;
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      }
    }

    // Bildschirm wach halten, solange die Seite sichtbar ist
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (err) {
        // z. B. Akkusparmodus oder fehlende Nutzerinteraktion (Safari) -> beim nächsten Tastendruck erneut
        wakeLock = null;
      }
    }

    // Browser geben den Lock frei, wenn der Tab verdeckt wird -> beim Zurückkehren neu anfordern
    document.addEventListener('visibilitychange', requestWakeLock);
    requestWakeLock();

    // Enter, Leertaste und die Tasten, die Presenter-Clicker senden
    const TOGGLE_KEYS = ['Enter', ' ', 'PageDown', 'PageUp', 'ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'];

    window.addEventListener('keydown', (e) => {
      requestWakeLock();
      if (TOGGLE_KEYS.includes(e.key)) {
        e.preventDefault();
        // Gedrückt gehaltene Taste ignorieren (sonst Start + sofortiger Reset)
        if (e.repeat) return;
        toggleTimer();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // Tippen / Klicken irgendwo auf dem Bildschirm (außer auf den Vollbild-Button)
    document.body.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target === fsButton) return;
      requestWakeLock();
      toggleTimer();
    });

    fsButton.addEventListener('click', toggleFullscreen);
    // Fokus nicht auf dem Button lassen, sonst löst Enter/Leertaste ihn aus
    fsButton.addEventListener('focus', () => fsButton.blur());

    renderDisplay();
  </script>
</body>
</html>
